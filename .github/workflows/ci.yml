name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: Portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
      - name: Resolve dependencies
        run: moon update
      - name: Formatting
        run: moon fmt --check
      - name: All-target typecheck
        run: moon check --target all --deny-warn
      - name: All-target tests
        run: moon test --target all --deny-warn
      - name: Runnable examples
        run: |
          moon run examples/build_tile --target wasm-gc
          moon run examples/filter_tile --target wasm-gc

  public-api:
    name: Public API and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
      - name: Resolve dependencies
        run: moon update
      - name: Generate documentation
        run: moon doc
      - name: Verify committed interfaces
        run: |
          moon info --target all
          git diff --exit-code
