name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: Portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
      - name: Resolve dependencies
        run: moon update
      - name: Formatting
        run: moon fmt --check
      - name: All-target typecheck
        run: moon check --target all --deny-warn
      - name: All-target tests
        run: moon test --target all --deny-warn
      - name: Runnable examples
        run: |
          moon run examples/build_tile --target wasm-gc
          moon run examples/filter_tile --target wasm-gc

  public-api:
    name: Public API and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
      - name: Resolve dependencies
        run: moon update
      - name: Generate documentation
        run: moon doc
      - name: Verify committed interfaces
        run: |
          moon info --target all
          git diff --exit-code

  interoperability:
    name: Independent interoperability and baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install independent reference tools
        run: |
          python -m pip install -r tools/interop/requirements.txt
          npm ci --prefix tools/interop
      - name: Python bidirectional interoperability
        run: python tools/interop/run.py
      - name: Mapbox JavaScript decoder interoperability
        run: npm run --prefix tools/interop check
      - name: Native release performance floor
        run: moon run --release --target native benchmarks/codec_bench
